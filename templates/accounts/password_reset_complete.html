{% extends 'base.html' %}

{% block title %}Password Reset Complete - SkillMatch{% endblock %}

{% block content %}
<div class="sm-narrow">
    <div class="sm-card sm-card-pad" style="text-align: center;">
        <h4 style="margin-bottom: 12px; color: var(--sm-success);">Password Reset Successful</h4>
        <p class="sm-muted" style="margin-bottom: 24px;">
            Your password has been changed successfully. You can now log in with your updated credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="sm-btn sm-btn-primary sm-btn-block">Log In Now</a>
    </div>
</div>
{% endblock %}

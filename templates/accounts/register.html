{% extends 'base.html' %}

{% block title %}Register - SkillMatch{% endblock %}

{% block content %}
<div class="sm-medium">
    <div class="sm-card sm-card-pad">
        <h4 style="margin-bottom: 18px;">Create Account</h4>

        <div data-tabs>
            <div class="sm-tabs">
                <button type="button" class="sm-tab active" data-tab="student">Student</button>
                <button type="button" class="sm-tab" data-tab="company">Company</button>
            </div>

            <div class="sm-tab-panel active" data-tab-panel="student">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="role" value="student">
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="s_email">Email</label>
                            <input type="email" name="email" id="s_email" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="s_college">College</label>
                            <select name="college" id="s_college" class="sm-select" required>
                                {% for college in student_form.fields.college.queryset %}
                                    <option value="{{ college.id }}">{{ college.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="s_department">Department</label>
                            <input type="text" name="department" id="s_department" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="s_semester">Semester</label>
                            <input type="number" name="semester" id="s_semester" class="sm-input" min="1" max="8" required>
                        </div>
                    </div>
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="s_password1">Password</label>
                            <input type="password" name="password1" id="s_password1" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="s_password2">Confirm Password</label>
                            <input type="password" name="password2" id="s_password2" class="sm-input" required>
                        </div>
                    </div>
                    <button type="submit" class="sm-btn sm-btn-primary sm-btn-block">Register as Student</button>
                </form>
            </div>

            <div class="sm-tab-panel" data-tab-panel="company">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="role" value="company">
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="c_email">Email</label>
                            <input type="email" name="email" id="c_email" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="c_org">Organization Name</label>
                            <input type="text" name="organization_name" id="c_org" class="sm-input" required>
                        </div>
                    </div>
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="c_contact">Contact Person</label>
                            <input type="text" name="contact_person" id="c_contact" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="c_industry">Industry</label>
                            <input type="text" name="industry" id="c_industry" class="sm-input" required>
                        </div>
                    </div>
                    <div class="sm-field">
                        <label for="c_description">Description</label>
                        <textarea name="description" id="c_description" class="sm-textarea" rows="3" required></textarea>
                    </div>
                    <div class="sm-form-row">
                        <div class="sm-field">
                            <label for="c_password1">Password</label>
                            <input type="password" name="password1" id="c_password1" class="sm-input" required>
                        </div>
                        <div class="sm-field">
                            <label for="c_password2">Confirm Password</label>
                            <input type="password" name="password2" id="c_password2" class="sm-input" required>
                        </div>
                    </div>
                    <button type="submit" class="sm-btn sm-btn-primary sm-btn-block">Register as Company</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

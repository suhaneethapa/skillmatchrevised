{% extends 'base.html' %}

{% block title %}Delete Internship - SkillMatch{% endblock %}

{% block content %}
<div class="sm-narrow">
    <div class="sm-card sm-card-pad" style="text-align: center; border-top: 3px solid var(--sm-danger);">
        <h5 style="color: var(--sm-danger); margin-bottom: 10px;">Delete Internship?</h5>
        <p style="margin-bottom: 18px;">
            Are you sure you want to delete <strong>{{ internship.title }}</strong>?
            <br>This action cannot be undone.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="sm-actions" style="justify-content: center;">
                <button type="submit" class="sm-btn sm-btn-danger">Yes, Delete</button>
                <a href="{% url 'companies:my_listings' %}" class="sm-btn sm-btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
